networks:
  monitoring-network:
    driver: bridge

services:

  # ─────────────────────────────────────────
  # MONITORING PLATFORM
  # ─────────────────────────────────────────
  monitoring-platform:
    build:
      context: ../app-monitoring-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monitoring-db:5432/app_monitoring_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_QUARTZ_JDBC_INITIALIZE_SCHEMA: always
      TZ: Africa/Tunis
    networks:
      - monitoring-network
    depends_on:
      - monitoring-db

  monitoring-db:
    image: postgres:15
    environment:
      POSTGRES_DB: app_monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      TZ: Africa/Tunis       
      PGTZ: Africa/Tunis     
    volumes:
      - monitoring-data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # STABLE APP CLUSTER
  # ─────────────────────────────────────────
  stable-app-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: stable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - stable-sftp
    networks:
      - monitoring-network

  stable-app-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: stable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - stable-sftp
    networks:
      - monitoring-network

  stable-app-node3:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: stable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - stable-sftp
    networks:
      - monitoring-network

  stable-source-db:
    image: postgres:15
    environment:
      POSTGRES_DB: stable_source
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/stable-source-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  stable-target-db:
    image: postgres:15
    environment:
      POSTGRES_DB: stable_target
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/stable-target-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  stable-sftp:
    image: atmoz/sftp
    command: monitor:password:::reports
    volumes:
      - ./sftp/stable:/home/monitor/reports
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # UNSTABLE APP CLUSTER
  # ─────────────────────────────────────────
  unstable-app-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: unstable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - unstable-sftp
    networks:
      - monitoring-network

  unstable-app-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: unstable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - unstable-sftp
    networks:
      - monitoring-network

  unstable-app-node3:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: unstable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - unstable-sftp
    networks:
      - monitoring-network

  unstable-source-db:
    image: postgres:15
    environment:
      POSTGRES_DB: unstable_source
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/unstable-source-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  unstable-target-db:
    image: postgres:15
    environment:
      POSTGRES_DB: unstable_target
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/unstable-target-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  unstable-sftp:
    image: atmoz/sftp
    command: monitor:password:::reports
    volumes:
      - ./sftp/unstable:/home/monitor/reports
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # BANKING APP (realistic e-banking scenario)
  # ─────────────────────────────────────────
  banking-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-node3:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-source-db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: admin
      APP_USER_PASSWORD: admin
    volumes:
      - ./sql/banking-source-init.sql:/container-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - monitoring-network

  banking-target-db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: admin
      APP_USER_PASSWORD: admin
    volumes:
      - ./sql/banking-target-init.sql:/container-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - monitoring-network

  banking-sftp:
    build:
      context: ./sftp/banking
      dockerfile: Dockerfile.banking-sftp
    environment:
      DB_HOST: banking-source-db
      DB_PORT: "1521"
      DB_NAME: FREEPDB1
      DB_USER: admin
      DB_PASS: admin
    depends_on:
      banking-source-db:
        condition: service_healthy
    networks:
      - monitoring-network

volumes:
  monitoring-data: