networks:
  monitoring-network:
    driver: bridge

services:

  # ─────────────────────────────────────────
  # MONITORING PLATFORM
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../app-monitoring-backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - monitoring-platform
      - monitoring-frontend
    networks:
      - monitoring-network

  monitoring-platform:
    image: appmonitoring-backend:prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monitoring-db:5432/app_monitoring_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_QUARTZ_JDBC_INITIALIZE_SCHEMA: always
      TZ: Africa/Tunis
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_URL: ${GROQ_URL}
      GROQ_MODEL: ${GROQ_MODEL}
    networks:
      - monitoring-network
    depends_on:
      - monitoring-db

  monitoring-frontend:
    image: appmonitoring-frontend:prod
    restart: unless-stopped
    networks:
      - monitoring-network

  monitoring-db:
    image: postgres:15
    environment:
      POSTGRES_DB: app_monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    volumes:
      - monitoring-data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # STABLE APP CLUSTER
  # ─────────────────────────────────────────
  stable-app-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: stable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - stable-sftp
    networks:
      - monitoring-network

  stable-app-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: stable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - stable-sftp
    networks:
      - monitoring-network

  stable-source-db:
    image: postgres:15
    environment:
      POSTGRES_DB: stable_source
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/stable-source-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  stable-sftp:
    build:
      context: ./sftp/stable
      dockerfile: Dockerfile.stable-sftp
    environment:
      DB_HOST: stable-source-db
      DB_PORT: "5432"
      DB_NAME: stable_source
      DB_USER: admin
      DB_PASS: admin
    depends_on:
      - stable-source-db
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # UNSTABLE APP CLUSTER — Legacy Recon Service
  # ─────────────────────────────────────────
  unstable-app-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: unstable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - unstable-sftp
    networks:
      - monitoring-network

  unstable-app-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: unstable-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
    depends_on:
      - unstable-sftp
    networks:
      - monitoring-network

  unstable-source-db:
    image: postgres:15
    environment:
      POSTGRES_DB: unstable_source
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./sql/unstable-source-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring-network

  unstable-sftp:
    build:
      context: ./sftp/unstable
      dockerfile: Dockerfile.unstable-sftp
    environment:
      DB_HOST: unstable-source-db
      DB_PORT: "5432"
      DB_NAME: unstable_source
      DB_USER: admin
      DB_PASS: admin
    depends_on:
      - unstable-source-db
    networks:
      - monitoring-network

  # ─────────────────────────────────────────
  # BANKING APP
  # ─────────────────────────────────────────
  banking-node1:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-node2:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-node3:
    build:
      context: ../target-app
      dockerfile: Dockerfile
    environment:
      SFTP_HOST: banking-sftp
      SFTP_USERNAME: monitor
      SFTP_PASSWORD: password
      SFTP_FOLDER: /reports
      APP_AUTH_ENABLED: "true"
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin123
    depends_on:
      - banking-sftp
    networks:
      - monitoring-network

  banking-source-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: banking_source
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      TZ: Africa/Tunis
    volumes:
      - ./sql/banking-source-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monitoring-network

  banking-target-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: banking_target
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      TZ: Africa/Tunis
    volumes:
      - ./sql/banking-target-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monitoring-network

  banking-sftp:
    build:
      context: ./sftp/banking
      dockerfile: Dockerfile.banking-sftp
    environment:
      DB_HOST: banking-source-db
      DB_PORT: "3306"
      DB_NAME: banking_source
      DB_USER: admin
      DB_PASS: admin
      DB_HOST_TARGET: banking-target-db
      DB_PORT_TARGET: "3306"
      DB_NAME_TARGET: banking_target
      DB_USER_TARGET: admin
      DB_PASS_TARGET: admin
    depends_on:
      banking-source-db:
        condition: service_healthy
      banking-target-db:
        condition: service_healthy
    networks:
      - monitoring-network

volumes:
  monitoring-data: